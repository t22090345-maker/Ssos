name: Build DJ Flashlight APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2

    - name: Create Project Structure and Files
      run: |
        mkdir -p app/src/main/java/com/sos/flashlight
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable

        # 1. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DJ Flashlight"
        include ':app'
        EOF

        # 2. build.gradle (Root)
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
        }
        EOF

        # 3. gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        android.nonTransitiveRClass=true
        kotlin.jvm.target.validation.mode = IGNORE
        EOF

        # 4. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.sos.flashlight'
            compileSdk 34

            defaultConfig {
                applicationId "com.sos.flashlight"
                minSdk 23
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

        # 5. AndroidManifest.xml (माइक्रोफोन परमिशन जोड़ी गई है बीट डिटेक्शन के लिए)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.FLASHLIGHT" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-feature android:name="android.hardware.camera" />
            <uses-feature android:name="android.hardware.camera.flash" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_lock_power_off"
                android:label="DJ Flashlight"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 6. strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">DJ Flashlight</string>
        </resources>
        EOF

        # 7. circle_button_bg.xml
        cat << 'EOF' > app/src/main/res/drawable/circle_button_bg.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#2196F3" />
        </shape>
        EOF

        # 8. activity_main.xml (नया UI: ऑडियो चुनने और DJ मोड के लिए)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0D47A1">

            <TextView
                android:id="@+id/tvTitle"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="60dp"
                android:text="DJ FLASHLIGHT"
                android:textColor="#FF5252"
                android:textSize="36sp"
                android:textStyle="bold"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintTop_toTopOf="parent" />

            <TextView
                android:id="@+id/tvFileName"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="20dp"
                android:text="No Audio Selected"
                android:textColor="#BBDEFB"
                android:textSize="16sp"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintTop_toBottomOf="@id/tvTitle" />

            <Button
                android:id="@+id/btnSelectAudio"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="20dp"
                android:backgroundTint="#1976D2"
                android:text="Choose Audio"
                android:textColor="#FFFFFF"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintTop_toBottomOf="@id/tvFileName" />

            <ImageButton
                android:id="@+id/btnPlayDj"
                android:layout_width="150dp"
                android:layout_height="150dp"
                android:layout_marginTop="50dp"
                android:background="@drawable/circle_button_bg"
                android:src="@android:drawable/ic_media_play"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintTop_toBottomOf="@id/btnSelectAudio" />

            <Button
                android:id="@+id/btnSosMode"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="40dp"
                android:backgroundTint="#D32F2F"
                android:text="SOS Mode (Manual)"
                android:textColor="#FFFFFF"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintTop_toBottomOf="@id/btnPlayDj" />

        </androidx.constraintlayout.widget.ConstraintLayout>
        EOF

        # 9. MainActivity.kt (DJ मोड और ऑडियो बीट डिटेक्शन का लॉजिक)
        cat << 'EOF' > app/src/main/java/com/sos/flashlight/MainActivity.kt
        package com.sos.flashlight

        import android.Manifest
        import android.content.Context
        import android.content.pm.PackageManager
        import android.hardware.camera2.CameraManager
        import android.media.MediaPlayer
        import android.media.audiofx.Visualizer
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.os.Handler
        import android.os.Looper
        import android.widget.Button
        import android.widget.ImageButton
        import android.widget.TextView
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import kotlin.math.abs

        class MainActivity : AppCompatActivity() {

            private lateinit var cameraManager: CameraManager
            private var cameraId: String? = null
            private var isFlashOn = false

            private lateinit var tvFileName: TextView
            private lateinit var btnSelectAudio: Button
            private lateinit var btnPlayDj: ImageButton
            private lateinit var btnSosMode: Button

            private var mediaPlayer: MediaPlayer? = null
            private var visualizer: Visualizer? = null
            private var selectedAudioUri: Uri? = null
            private var isDjPlaying = false

            // SOS मोड के लिए
            private var isSosMode = false
            private val handler = Handler(Looper.getMainLooper())
            private val flashRunnable = object : Runnable {
                override fun run() {
                    toggleFlash(!isFlashOn)
                    if (isSosMode) {
                        handler.postDelayed(this, 300)
                    }
                }
            }

            // ऑडियो चुनने का लांचर
            private val getContent = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                uri?.let {
                    selectedAudioUri = it
                    tvFileName.text = "Audio Ready!"
                }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                cameraManager = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                try {
                    cameraId = cameraManager.cameraIdList[0]
                } catch (e: Exception) {
                    e.printStackTrace()
                }

                tvFileName = findViewById(R.id.tvFileName)
                btnSelectAudio = findViewById(R.id.btnSelectAudio)
                btnPlayDj = findViewById(R.id.btnPlayDj)
                btnSosMode = findViewById(R.id.btnSosMode)

                btnSelectAudio.setOnClickListener {
                    getContent.launch("audio/*")
                }

                btnPlayDj.setOnClickListener {
                    if (selectedAudioUri == null) {
                        Toast.makeText(this, "पहले ऑडियो चुनें!", Toast.LENGTH_SHORT).show()
                    } else if (isDjPlaying) {
                        stopDjMode()
                    } else {
                        checkPermissionAndStartDj()
                    }
                }

                btnSosMode.setOnClickListener {
                    if (isDjPlaying) stopDjMode()
                    if (isSosMode) {
                        stopSosMode()
                    } else {
                        startSosMode()
                    }
                }
            }

            private fun checkPermissionAndStartDj() {
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                } else {
                    startDjMode()
                }
            }

            override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                if (requestCode == 101 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                    startDjMode()
                } else {
                    Toast.makeText(this, "ऑडियो बीट के लिए माइक्रोफोन परमिशन चाहिए!", Toast.LENGTH_LONG).show()
                }
            }

            private fun startDjMode() {
                try {
                    mediaPlayer = MediaPlayer().apply {
                        setDataSource(this@MainActivity, selectedAudioUri!!)
                        prepare()
                        start()
                        setOnCompletionListener { stopDjMode() }
                    }

                    val sessionId = mediaPlayer!!.audioSessionId
                    visualizer = Visualizer(sessionId).apply {
                        captureSize = Visualizer.getCaptureSizeRange()[1]
                        setDataCaptureListener(object : Visualizer.OnDataCaptureListener {
                            override fun onWaveFormDataCapture(visualizer: Visualizer, waveform: ByteArray, samplingRate: Int) {
                                var sum = 0.0
                                for (b in waveform) {
                                    sum += abs(b.toInt()).toDouble()
                                }
                                val amplitude = sum / waveform.size
                                // अगर आवाज़ का स्तर एक लिमिट से ज्यादा है तो फ्लैश ऑन करें
                                if (amplitude > 10.0) {
                                    toggleFlash(true)
                                } else {
                                    toggleFlash(false)
                                }
                            }

                            override fun onFftDataCapture(visualizer: Visualizer, fft: ByteArray, samplingRate: Int) {}
                        }, Visualizer.getMaxCaptureRate() / 2, true, false)
                        enabled = true
                    }

                    isDjPlaying = true
                    btnPlayDj.setImageResource(android.R.drawable.ic_media_pause)
                    tvFileName.text = "DJ Mode: ON 🔥"
                    btnSosMode.isEnabled = false
                } catch (e: Exception) {
                    e.printStackTrace()
                    Toast.makeText(this, "ऑडियो चलाने में एरर आया!", Toast.LENGTH_SHORT).show()
                }
            }

            private fun stopDjMode() {
                isDjPlaying = false
                btnPlayDj.setImageResource(android.R.drawable.ic_media_play)
                tvFileName.text = "Audio Ready!"
                btnSosMode.isEnabled = true
                
                visualizer?.release()
                visualizer = null
                
                mediaPlayer?.stop()
                mediaPlayer?.release()
                mediaPlayer = null
                
                toggleFlash(false)
            }

            private fun startSosMode() {
                if (cameraId == null) return
                isSosMode = true
                btnSosMode.text = "STOP SOS"
                handler.post(flashRunnable)
            }

            private fun stopSosMode() {
                isSosMode = false
                btnSosMode.text = "SOS Mode (Manual)"
                handler.removeCallbacks(flashRunnable)
                toggleFlash(false)
            }

            private fun toggleFlash(state: Boolean) {
                try {
                    if (cameraId != null && isFlashOn != state) {
                        cameraManager.setTorchMode(cameraId!!, state)
                        isFlashOn = state
                    }
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                if (isDjPlaying) stopDjMode()
                if (isSosMode) stopSosMode()
            }
        }
        EOF

        gradle wrapper --gradle-version 8.2 --no-daemon

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DJ-Flashlight-APK
        path: app/build/outputs/apk/debug/app-debug.apk
