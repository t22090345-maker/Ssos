name: Build DJ Flashlight APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2

    - name: Create Project Structure and Files
      run: |
        mkdir -p app/src/main/java/com/sos/flashlight
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DJ Flashlight"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
        }
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official
        android.nonTransitiveRClass=true
        kotlin.jvm.target.validation.mode = IGNORE
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.sos.flashlight'
            compileSdk 34

            defaultConfig {
                applicationId "com.sos.flashlight"
                minSdk 23
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.FLASHLIGHT" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-feature android:name="android.hardware.camera" />
            <uses-feature android:name="android.hardware.camera.flash" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_lock_power_off"
                android:label="DJ Flashlight"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">DJ Flashlight</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/circle_button_bg.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
            <solid android:color="#2196F3" />
        </shape>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0D47A1">

            <TextView
                android:id="@+id/tvTitle"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="50dp"
                android:text="DJ FLASHLIGHT"
                android:textColor="#FF5252"
                android:textSize="36sp"
                android:textStyle="bold"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintTop_toTopOf="parent" />

            <TextView
                android:id="@+id/tvFileName"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="10dp"
                android:text="No Audio Selected"
                android:textColor="#BBDEFB"
                android:textSize="16sp"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintTop_toBottomOf="@id/tvTitle" />

            <!-- Volume Meter जो बताएगा आवाज़ कितनी तेज़ है -->
            <TextView
                android:id="@+id/tvVolume"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="5dp"
                android:text="Beat: 0"
                android:textColor="#4CAF50"
                android:textSize="18sp"
                android:textStyle="bold"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintTop_toBottomOf="@id/tvFileName" />

            <Button
                android:id="@+id/btnSelectAudio"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="15dp"
                android:backgroundTint="#1976D2"
                android:text="Choose Audio"
                android:textColor="#FFFFFF"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintTop_toBottomOf="@id/tvVolume" />

            <ImageButton
                android:id="@+id/btnPlayDj"
                android:layout_width="140dp"
                android:layout_height="140dp"
                android:layout_marginTop="30dp"
                android:background="@drawable/circle_button_bg"
                android:src="@android:drawable/ic_media_play"
                app:layout_constraintEnd_toEndOf="parent"
                app:layout_constraintStart_toStartOf="parent"
                app:layout_constraintTop_toBottomOf="@id/btnSelectAudio" />

        </androidx.constraintlayout.widget.ConstraintLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/sos/flashlight/MainActivity.kt
        package com.sos.flashlight

        import android.Manifest
        import android.content.Context
        import android.content.pm.PackageManager
        import android.hardware.camera2.CameraManager
        import android.media.MediaPlayer
        import android.media.audiofx.Visualizer
        import android.net.Uri
        import android.os.Bundle
        import android.widget.Button
        import android.widget.ImageButton
        import android.widget.TextView
        import android.widget.Toast
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import kotlin.math.sqrt

        class MainActivity : AppCompatActivity() {

            private lateinit var cameraManager: CameraManager
            private var cameraId: String? = null
            private var isFlashOn = false
            private var lastFlashToggleTime = 0L

            private lateinit var tvFileName: TextView
            private lateinit var tvVolume: TextView
            private lateinit var btnSelectAudio: Button
            private lateinit var btnPlayDj: ImageButton

            private var mediaPlayer: MediaPlayer? = null
            private var visualizer: Visualizer? = null
            private var selectedAudioUri: Uri? = null
            private var isDjPlaying = false

            private val getContent = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                uri?.let {
                    selectedAudioUri = it
                    tvFileName.text = "Audio Ready!"
                }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                cameraManager = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                try {
                    cameraId = cameraManager.cameraIdList[0]
                } catch (e: Exception) {
                    e.printStackTrace()
                }

                tvFileName = findViewById(R.id.tvFileName)
                tvVolume = findViewById(R.id.tvVolume)
                btnSelectAudio = findViewById(R.id.btnSelectAudio)
                btnPlayDj = findViewById(R.id.btnPlayDj)

                btnSelectAudio.setOnClickListener {
                    getContent.launch("audio/*")
                }

                btnPlayDj.setOnClickListener {
                    if (selectedAudioUri == null) {
                        Toast.makeText(this, "पहले ऑडियो चुनें!", Toast.LENGTH_SHORT).show()
                    } else if (isDjPlaying) {
                        stopDjMode()
                    } else {
                        checkPermissionAndStartDj()
                    }
                }
            }

            private fun checkPermissionAndStartDj() {
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                } else {
                    startDjMode()
                }
            }

            override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                if (requestCode == 101 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                    startDjMode()
                } else {
                    Toast.makeText(this, "माइक्रोफोन परमिशन के बिना DJ मोड काम नहीं करेगा!", Toast.LENGTH_LONG).show()
                }
            }

            private fun startDjMode() {
                try {
                    mediaPlayer = MediaPlayer().apply {
                        setDataSource(this@MainActivity, selectedAudioUri!!)
                        prepare()
                        start()
                        setOnCompletionListener { stopDjMode() }
                    }

                    val sessionId = mediaPlayer!!.audioSessionId
                    visualizer = Visualizer(sessionId).apply {
                        captureSize = Visualizer.getCaptureSizeRange()[1]
                        setDataCaptureListener(object : Visualizer.OnDataCaptureListener {
                            override fun onWaveFormDataCapture(visualizer: Visualizer, waveform: ByteArray, samplingRate: Int) {
                                // RMS (Root Mean Square) निकालना जो बीट को सटीकता से पकड़ता है
                                var sum = 0.0
                                for (b in waveform) {
                                    sum += (b.toDouble() * b.toDouble())
                                }
                                val rms = sqrt(sum / waveform.size)
                                // 0-100 के स्केल में बदलना (128 अधिकतम वैल्यू है)
                                val volume = ((rms / 128.0) * 100).toInt()

                                // UI पर वॉल्यूम दिखाना (Main Thread पर)
                                runOnUiThread {
                                    tvVolume.text = "Beat: $volume"
                                }

                                // Threshold: अगर आवाज़ 25 से ज्यादा है तो लाइट जलाओ
                                if (volume > 25) {
                                    toggleFlash(true)
                                } else {
                                    toggleFlash(false)
                                }
                            }

                            override fun onFftDataCapture(visualizer: Visualizer, fft: ByteArray, samplingRate: Int) {}
                        }, Visualizer.getMaxCaptureRate() / 2, true, false)
                        enabled = true
                    }

                    isDjPlaying = true
                    btnPlayDj.setImageResource(android.R.drawable.ic_media_pause)
                    tvFileName.text = "DJ Mode: ON 🔥"
                    btnSelectAudio.isEnabled = false
                } catch (e: Exception) {
                    e.printStackTrace()
                    Toast.makeText(this, "ऑडियो चलाने में एरर!", Toast.LENGTH_SHORT).show()
                }
            }

            private fun stopDjMode() {
                isDjPlaying = false
                btnPlayDj.setImageResource(android.R.drawable.ic_media_play)
                tvFileName.text = "Audio Ready!"
                tvVolume.text = "Beat: 0"
                btnSelectAudio.isEnabled = true
                
                visualizer?.release()
                visualizer = null
                
                mediaPlayer?.stop()
                mediaPlayer?.release()
                mediaPlayer = null
                
                toggleFlash(false)
            }

            // 🔥 Hardware Protection: 50ms का डिले ताकि कैमरा हैंग न हो
            private fun toggleFlash(state: Boolean) {
                val currentTime = System.currentTimeMillis()
                if (currentTime - lastFlashToggleTime < 50) return // 50ms से पहले स्टेट न बदलें
                if (isFlashOn == state) return // अगर पहले से उसी स्टेट में है तो कुछ न करें

                try {
                    if (cameraId != null) {
                        cameraManager.setTorchMode(cameraId!!, state)
                        isFlashOn = state
                        lastFlashToggleTime = currentTime
                    }
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                if (isDjPlaying) stopDjMode()
            }
        }
        EOF

        gradle wrapper --gradle-version 8.2 --no-daemon

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DJ-Flashlight-APK
        path: app/build/outputs/apk/debug/app-debug.apk
